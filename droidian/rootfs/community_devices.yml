# Community device entry consumed by the Droidian rootfs workspace generated by
# droidian/scripts/bootstrap-rootfs.sh.
.samsung_r8q_packages:
  packages: &samsung_r8q_packages
    - adaptation-samsung-r8q
    - adaptation-samsung-r8q-configs
    - linux-image-samsung-r8q
    - linux-bootimage-samsung-r8q

samsung_r8q:
  type: image
  arch: arm64
  edition: phosh
  variant: phone
  apilevel: 30
  packages: *samsung_r8q_packages
